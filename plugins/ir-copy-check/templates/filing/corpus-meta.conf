# Freshness guard for this corpus. Read by corpus_status.sh (shell-sourced:
# KEY=VALUE, no spaces around =). Set these deliberately.

# The fiscal year the corpus covers.
FISCAL_YEAR_END=YYYY-MM-DD

# Last date the corpus may be cited as current. Pick the earliest date by which a
# material later filing (the next 10-Q or 10-K) or a stated corporate milestone
# supersedes this corpus. Past this date, /critique-vs-10k refuses to run unless
# explicitly overridden.
DROP_DEAD=YYYY-MM-DD

# Optional one-line reminder carried into every critique (e.g. a note that this
# fiscal year predates a later acquisition or event).
SNAPSHOT_NOTE=""
